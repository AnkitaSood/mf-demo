<nav class="shell-nav">
  <div class="shell-nav__brand">
    <span class="shell-nav__logo">⬡</span>
    <span class="shell-nav__title">MF Demo</span>
    <span class="shell-nav__badge">Module Federation</span>
  </div>
  <ul class="shell-nav__links" role="navigation" aria-label="Main navigation">
    <li>
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" id="nav-home">
        Home
      </a>
    </li>
    <li>
      <a routerLink="/react/products" routerLinkActive="active" id="nav-react-products">
        ⚛ Legos
      </a>
    </li>
    <li>
      <a routerLink="/react/about-us" routerLinkActive="active" id="nav-react-about">
        ⚛ About
      </a>
    </li>
    <li>
      <a routerLink="/vue/products" routerLinkActive="active" id="nav-vue-products">
        💚 Shirts
      </a>
    </li>
    <li>
      <a routerLink="/vue/contact-us" routerLinkActive="active" id="nav-vue-contact">
        💚 Contact
      </a>
    </li>
  </ul>
  <div class="shell-nav__counter">
    <button class="shell-btn shell-btn--ghost" (click)="updateCount(-1)">−</button>
    <span class="shell-nav__counter-val">{{ count() }}</span>
    <button class="shell-btn shell-btn--ghost" (click)="updateCount(1)">+</button>
  </div>
  <button class="theme-toggle" (click)="toggleTheme()" aria-label="Toggle Theme">
    @if (theme() === 'dark') {
      ☀️
    } @else {
      🌙
    }
  </button>
</nav>

<main class="shell-content">
  <router-outlet />
</main>
